# The authority ceiling of each program (cancho docs/agent-toolbox.md D12; cancho-tools' tools.toml is the model).
#
# This file is what a person writes and reviews. It is a *ceiling*, never the authority: the authority is whatever `cancho authority` derives
# from the source (manifests/<tool>.authority.json, embedded in the binary and printed by `<tool> introspect`), and scripts/manifest.py
# --check fails when a derived label is not allowed here. Widening a program is therefore an edit to this file: a reviewable diff. Rows are
# exact in both directions for what is allowed: the derived set may be smaller than the ceiling, never larger.
#
# A label with an argument is written as the compiler prints it: fs_read(""). No program may hold ffi, net_out or net_in. `clock` is
# excusable only where `exceptions` names it with a reason (flow's deadline), and `exec` only for `flow`. `flow-records` is read-only by
# construction: scripts/manifest.py fails it if it derives exec, clock, a write, a pipe or a child signal, whatever this file allows.

max_tools = 2

[flow]
allow = ["args", "child_signal", "clock", "dir_read", "dir_write", "err_write", "exec(\"/opt/cancho-flow/programs\")", "file_read", "file_write", "fs_read(\"\")", "heap", "io_read", "io_write", "pipe_read", "pipe_write", "poll"]
exceptions = { clock = "the deadline of a step (design.md D13, section 7): the step is killed at --timeout-ms; no time of day reaches a record" }

[flow-records]
allow = ["args", "dir_read", "err_write", "file_read", "fs_read(\"\")", "heap", "io_write"]
