# What this workflow runs: scripts/check.sh, the repository's gate (authority, the gates G1 to G17, every mutant, the landing page's checks), on Linux x86-64.
# The compiler is the release cancho.toml names, installed prebuilt with cancho's scripts/install.sh (no Rust).
# Third-party actions are pinned by full commit SHA. Only Linux x86-64 is covered: the gate has not been run on macOS or aarch64.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flow
          persist-credentials: false

      - name: Platform
        run: |
          uname -a
          cc --version | head -1 || true
          python3 --version

      - name: Install the compiler release cancho.toml pins
        working-directory: flow
        run: |
          pin=$(sed -n 's/^cancho *= *"\([0-9a-f.]*\)".*/\1/p' cancho.toml)
          test -n "$pin" || { echo "cancho.toml has no compiler pin" >&2; exit 1; }
          curl -fsSL https://raw.githubusercontent.com/alpibrusl/cancho/main/scripts/install.sh | sh -s "$pin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "CANCHO=$HOME/.local/bin/cancho" >> "$GITHUB_ENV"

      - name: The compiler runs
        run: "$HOME/.local/bin/cancho" --version

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # scripts/check.sh: `cancho install` (the pinned contract modules), both programs, the authority check (G8), the gates G1 to G17 and G10, every mutant (each must be killed),
      # `site.py --check` (the landing page's replayed output and figures are what the built programs print) and the checks of the landing page and its contrast.
      # The standard input is closed on purpose: no gate may depend on the runner's.
      - name: The gate (scripts/check.sh)
        working-directory: flow
        run: time sh scripts/check.sh < /dev/null
