# What this workflow runs: scripts/check.sh, the repository's gate (authority, the gates G1 to G17, every mutant, the landing page's checks), on Linux x86-64.
# The compiler is the commit cancho.toml names, built from its committed seed with clang (no Rust: cancho docs/seed.md), the way cancho-table, cancho-ml and cancho-stats do.
# Third-party actions are pinned by full commit SHA. What it does not run, and why, is in the step that says so.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flow
          persist-credentials: false

      - name: Platform
        run: |
          uname -a
          cc --version | head -1 || true
          python3 --version

      - name: The compiler revision, read from cancho.toml
        id: pins
        working-directory: flow
        run: |
          rev=$(sed -n 's/^cancho *= *"\([0-9a-f]*\)".*/\1/p' cancho.toml)
          test "${#rev}" -eq 40 || { echo "cancho.toml has no 40-digit compiler revision" >&2; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "compiler revision $rev"

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cancho/target/release/cancho
          key: cancho-selfhost-${{ steps.pins.outputs.rev }}-linux-x86_64

      - name: Check out the compiler
        if: steps.compiler.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pins.outputs.rev }}
          path: cancho
          persist-credentials: false

      - name: Build the compiler (the one written in cancho)
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: time sh scripts/build-standalone.sh --out "$PWD/target/release" --rev "${{ steps.pins.outputs.rev }}"

      - name: The compiler runs
        run: |
          echo "CANCHO=$GITHUB_WORKSPACE/cancho/target/release/cancho" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/cancho/target/release" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/cancho/target/release/cancho" --version

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # scripts/check.sh: `cancho install` (the pinned contract modules), both programs, the authority check (G8), the gates G1 to G17 and G10, every mutant
      # (each must be killed), the checks of the landing page and its contrast. SKIP_SITE_CHECK leaves out `scripts/site.py --check` alone: the replayed output of
      # the page and docs/agents.md are the maintainer's platform's (BSD `uniq -c` spacing, an absolute path), so the comparison is only true where the page was generated.
      # The standard input is closed on purpose: no gate may depend on the runner's.
      - name: The gate (scripts/check.sh)
        working-directory: flow
        env:
          SKIP_SITE_CHECK: "1"
        run: time sh scripts/check.sh < /dev/null
